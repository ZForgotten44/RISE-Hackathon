<body data-tone="dark">

<header>
  <div class="hleft"><a class="brandmark" href="/" aria-label="Z Forgotten Games, home"><img src="/duck-face.png" alt="" width="26" height="26"></a><a class="back" href="/arcade">&larr; All games</a></div>

<main class="cpage" aria-labelledby="createTitle">
  <h1 id="createTitle">Create a room</h1>
  <p class="sub">Choose a game, set it up, and share the link.</p>
  <div class="ctools">
    <label class="csearch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="search" id="pickSearch" placeholder="Search games" aria-label="Search games" autocomplete="off"></label>
    <div class="cfilters" role="group" aria-label="Show">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="online" aria-pressed="false">Two-player</button>
    </div>
  </div>
  <div class="cgrid" id="picks" aria-label="Games you can host"></div>
  <p class="cempty" id="pickEmpty" hidden>No game matches. <button type="button" id="pickClear">Show all</button></p>
  <p class="alt">Got a code? <a href="/join">Join a room</a></p>
</main>

<footer class="rfoot"><div class="sitelinks" role="navigation" aria-label="Site"><a href="/join">Join a room</a><a href="/create">Create a room</a><a href="/arcade">All games</a><a href="/story">Our story</a></div></footer>

<script>
/* The Games section's own cards (ZF.renderGrid), in the same order, keeping only the games that have rooms. In room
   mode a card's action is Set up room, which opens /<game>?create: that game's existing Room settings, where nothing is
   created until the host presses Create room. Rules stays on each card. The illustrations play exactly as on All
   games: on hover or focus with a mouse, and while a card is on screen on a phone (paused when it scrolls away). */
(function(){
  const $=id=>document.getElementById(id);
  const grid=ZF.renderGrid($('picks'),{num:false,room:true,only:g=>g.mode==='online'||g.mode==='party'});
  const cards=[...grid.children], byId=Object.fromEntries(ZF.GAMES.map(g=>[g.id,g]));
  /* words people search for here that the names and premises don't say */
  const TERMS={gold:'strategy coins',domineering:'strategy dominoes',nim:'strategy math piles',pentago:'strategy marbles',notakto:'strategy tic tac toe',toot:'strategy words letters',sim:'strategy graph triangles',pond:'couples partner date predict two',trap:'platformer build race obstacles trap two',tail:'snake slither grow cut steal tail arcade group',quack:'funny writing answers vote comedy',duckoff:'drawing draw sketch impostor bluff',explain:'impostor bluff questions social deduction',wrongpond:'impostor words clues social deduction',normal:'funny writing rules vote comedy',court:'funny trial judge vote comedy roleplay',mafia:'impostor werewolf secret roles social deduction'};
  const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  const q=$('pickSearch'), fbtns=[...document.querySelectorAll('.cfilters button')]; let filter='all';
  function apply(){ const t=norm(q.value).trim().split(/\s+/).filter(Boolean); let n=0;
    cards.forEach(c=>{ const g=byId[c.dataset.id], hay=norm([g.name,g.rule,TERMS[g.id],g.keywords,g.mode==='party'?'party group':'two player 2 players online'].join(' '));
      const on=(filter==='all'||g.mode===filter)&&t.every(w=>hay.includes(w)); c.hidden=!on; if(on) n++; });
    $('pickEmpty').hidden=n>0; }
  fbtns.forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; fbtns.forEach(x=>x.setAttribute('aria-pressed',String(x===b))); apply(); }));
  q.addEventListener('input',apply);
  q.addEventListener('keydown',e=>{ if(e.key==='Escape'&&q.value){ e.preventDefault(); q.value=''; apply(); } });
  $('pickClear').onclick=()=>{ q.value=''; filter='all'; fbtns.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f==='all'))); apply(); q.focus(); };
})();
</script>
<script src="/offline.js?v=62a5d5dd"></script>
