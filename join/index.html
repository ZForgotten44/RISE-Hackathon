<script>
/* the room server address, exactly as tools/arcade-template.html sets it for every game page */
(function(){ var h=location.hostname, local=h==='localhost'||h==='127.0.0.1'||/^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h);
  window.ZF_ROOM_WS_URL = local ? 'ws://'+h+':8787' : 'wss://zfgames-room-server.onrender.com'; })();
</script>

<body data-tone="dark">

<header>
  <div class="hleft"><a class="brandmark" href="/" aria-label="Z Forgotten Games, home"><img src="/duck-face.png" alt="" width="26" height="26"></a><a class="back" href="/arcade">&larr; All games</a></div>
  <div class="right">
    <button type="button" class="themesw" data-theme-toggle aria-label="Invert colors" title="Invert colors"><span class="ts-knob"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 8.94 10.06A7 7 0 0 1 12 3Z" fill="currentColor"/></svg></span></button>
  </div>
</header>

<main class="rp">
  <section class="sheet" aria-labelledby="joinTitle">
    <h1 id="joinTitle">Join a room</h1>
    <p class="lead">Enter the code shown by your host.</p>
    <form class="jform" id="joinForm" novalidate>
      <input id="code" name="code" class="codein" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="200" enterkeyhint="go" placeholder="ABCD" aria-label="Room code" aria-describedby="codeMsg">
      <div class="msg" id="codeMsg" role="status" aria-live="polite"></div>
      <button class="roombtn fill" id="joinBtn" type="submit">Join room →</button>
    </form>
    <p class="jlinks"><button type="button" class="quiet" id="pasteLink">Have an invitation link? Paste it here</button><a href="/create">Create a room instead</a></p>
  </section>
</main>

<footer class="rfoot"><div class="sitelinks" role="navigation" aria-label="Site"><a href="/join">Join a room</a><a href="/create">Create a room</a><a href="/arcade">All games</a><a href="/story">Our story</a></div></footer>

<script>
/* Join a room: one code, and the game is found from it. The code rule is room-codes.js, the same file the room servers
   make codes with. Online friend rooms (two-player games) answer 'preview'. Nothing is joined here: a found room opens that game's own page with
   ?room=CODE, the same address as an invite link, so the nickname, duck and joining steps are the game's usual ones. */
(function(){
  const $=id=>document.getElementById(id), RC=window.ZFRoomCodes;
  const ONLINE={nim:['nim','Nim'],pentago:['pentago','Pentago'],notakto:['notakto','Notakto'],toot:['toot-otto','TOOT & OTTO'],sim:['sim','Sim'],gold:['gold-coin','The Gold Coin']};
  const form=$('joinForm'), inp=$('code'), btn=$('joinBtn'), msg=$('codeMsg');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ls=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const UNREACHABLE='<b>Can’t reach the room server</b>Check your connection and try again. Your code is still here.';
  const NOT_FOUND='<b>Room not found.</b>Check the code with your host.';
  /* keep the field, the message and the button on screen above a phone keyboard */
  const keepInView=()=>{ if(matchMedia('(max-width:640px)').matches) setTimeout(()=>btn.scrollIntoView({block:'nearest',behavior:'smooth'}),250); };
  function say(html,bad){ msg.innerHTML=html; inp.setAttribute('aria-invalid',bad?'true':'false'); if(html) keepInView(); }
  let busy=false, found=null, sock=null, wakeT=0, giveT=0;
  function setBusy(label){ busy=true; btn.disabled=true; btn.textContent=label; inp.readOnly=true; }
  function idle(){ busy=false; found=null; btn.disabled=false; btn.textContent='Join room →'; inp.readOnly=false; clearTimeout(wakeT); clearTimeout(giveT); if(sock){ sock.onclose=null; try{ sock.close(); }catch(e){} sock=null; } }
  /* show the game and the room, then Continue opens that game's own joining screen (nickname, duck) */
  function go(h,code){ found={url:'/'+h.slug+'?room='+encodeURIComponent(code)}; busy=false; clearTimeout(wakeT); clearTimeout(giveT);
    inp.readOnly=true; btn.disabled=false; btn.textContent='Continue →';
    say(`<span class="found"><b>${esc(h.name)}</b>${h.detail?`<span>${esc(h.detail)}</span>`:''}${h.note?`<span>${esc(h.note)}</span>`:''}</span><button type="button" class="quiet" id="otherCode">Use a different code</button>`);
    $('otherCode').onclick=()=>{ idle(); say(''); inp.select(); }; btn.focus(); }

  function look(code,kinds){
    setBusy('Connecting…'); say('Connecting to the room server…');
    const want=['online'], got={};
    wakeT=setTimeout(()=>say('Connecting to the room server… It may be waking up, which can take up to a minute after a quiet spell. Your code is kept.'),4000);
    giveT=setTimeout(()=>{ idle(); say(UNREACHABLE,true); },75000);
    try{ sock=new WebSocket(window.ZF_ROOM_WS_URL); }catch(e){ idle(); say(UNREACHABLE,true); return; }
    sock.onopen=()=>{ const s=m=>sock.send(JSON.stringify(m)); btn.textContent='Finding your room…';
      s({t:'preview',code}); };
    sock.onclose=()=>{ if(busy){ idle(); say(UNREACHABLE,true); } };
    sock.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.t==='previewResult') got.online={found:true,game:m.game,full:m.full,status:m.status,host:m.hostNickname};
      else if(m.t==='error'&&want[0]==='online') got.online={found:false,code:m.code};
      else return;
      if(want.every(k=>got[k])){ const s=sock; sock.onclose=null; sock=null; try{ s.close(); }catch(e){} decide(code,got); } };
  }

  function decide(code,got){
    const hits=[], stop=[];
    if(got.online){ const o=got.online, g=o.found&&ONLINE[o.game];
      if(g&&o.status!=='abandoned'&&o.status!=='expired'){
        if(o.full&&!ls('zf-room-'+code)) stop.push(o.status==='active'||o.status==='finished'?`<b>This game has already started.</b>Both seats in this ${esc(g[1])} room are taken, and two-player rooms can’t be watched. Ask your host for a new room.`:'<b>This room is full.</b>Both seats are taken.');
        else hits.push({slug:g[0],name:g[1],detail:'Online · 2 players'+(o.host?' · hosted by '+o.host:'')}); } }
    if(hits.length===1) return go(hits[0],code);
    idle();
    if(hits.length>1){ say(`<b>Two rooms use ${esc(code)}</b>Which game are you joining?<span class="choices">${hits.map((h,i)=>`<button type="button" class="roombtn" data-i="${i}">${esc(h.name)}</button>`).join('')}</span>`);
      msg.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>go(hits[+b.dataset.i],code)); return; }
    say(stop.length?stop[0]:NOT_FOUND,true);
  }

  form.addEventListener('submit',e=>{ e.preventDefault(); if(busy) return;   // one lookup at a time
    if(found){ btn.disabled=true; btn.textContent='Opening…'; location.assign(found.url); return; }
    const code=RC.normalize(inp.value); inp.value=code;
    if(!code){ say('<b>Enter a room code.</b>It’s on your host’s screen or in their invite.',true); inp.focus(); return; }
    const kinds=RC.kindsOf(code);
    if(!kinds.includes('friend')){ say('<b>That isn’t a room code.</b>Check the code and try again.',true); inp.focus(); return; }
    look(code,kinds); });
  inp.addEventListener('input',()=>{ if(!busy&&inp.getAttribute('aria-invalid')==='true') say(''); });
  inp.addEventListener('focus',keepInView);
  /* /join?code=ABCD fills the field (the room itself still opens only on Join room) */
  { const q=new URLSearchParams(location.search), c=q.get('code')||q.get('room'); if(c) inp.value=RC.normalize(c); }
  /* a page restored from the back/forward cache never comes back mid-lookup */
  addEventListener('pageshow',e=>{ if(e.persisted){ idle(); say(''); } });
  /* an invitation link works in the same field (the room code is read from it); the button reads the clipboard where
     the browser allows it, and otherwise just readies the field for a paste */
  $('pasteLink').addEventListener('click',async()=>{ if(busy) return; if(found) idle(); say(''); inp.placeholder='Paste the link'; inp.value=''; inp.focus();
    try{ const t=navigator.clipboard&&navigator.clipboard.readText?await navigator.clipboard.readText():''; if(t&&RC.kindsOf(RC.normalize(t)).length){ inp.value=RC.normalize(t); form.requestSubmit(); } }catch(e){} });
  inp.addEventListener('paste',()=>setTimeout(()=>{ const c=RC.normalize(inp.value); if(c!==inp.value&&RC.kindsOf(c).length) inp.value=c; },0));
  if(matchMedia('(hover:hover) and (pointer:fine)').matches) inp.focus();
})();
</script>
<script src="/offline.js?v=62a5d5dd"></script>
</body>
</html>
