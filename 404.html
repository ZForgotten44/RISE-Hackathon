<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;justify-content:flex-end;padding:18px 5vw 0}
.mainrow{flex:1;display:flex;align-items:center;justify-content:center;padding:5vw;min-height:0}
.wrap404{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:420px;margin-bottom:9vh}
.row404{display:flex;align-items:center;gap:16px;margin-bottom:2px}
.num404{font-family:var(--font-sans);font-weight:700;font-size:clamp(44px,8vw,72px);letter-spacing:-.02em;line-height:1;color:var(--g5)}
.duckwrap404{width:clamp(56px,9vw,86px);flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.duckwrap404 svg{width:100%;height:auto;display:block;overflow:visible}
.duckwrap404 .dk{animation:d4bob 3.2s ease-in-out infinite}
.duckwrap404 .ln{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.duckwrap404 .ln.fl{fill:var(--bg)}
.duckwrap404 .ln.bk{fill:var(--g2)}
.duckwrap404 .sh{fill:var(--g2)}
.duckwrap404 .grd{fill:var(--g2)}
.duckwrap404 .pu{fill:var(--fg)}
.duckwrap404 .eyew{fill:var(--bg)}
@keyframes d4bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.duckwrap404 .dk{animation:none}}
h1{font-family:var(--font-sans);font-weight:700;font-size:clamp(19px,2.6vw,24px);letter-spacing:-.01em;margin:0}
.sub{color:var(--g5);font-size:14px;line-height:1.5;max-width:34ch}
.acts404{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.b404{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:var(--r-ctl);font:600 14px var(--font-sans);letter-spacing:.01em;text-decoration:none;transition:transform .16s,opacity .16s,background .15s,color .15s}
.b404.pri{background:var(--fg);color:var(--bg)}.b404.pri:hover{opacity:.9;transform:translateY(-1px)}
.b404.pri:active{transform:scale(.98)}
.b404.quiet{padding:0;min-height:0;color:var(--g5);border-bottom:1px solid transparent}
.b404.quiet:hover{color:var(--fg);border-bottom-color:currentColor}
.b404:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style></head>

<script>
document.getElementById('duck404').addEventListener('click',function(){ if(window.ZS) ZS.play('surprise'); });

</body></html>
