<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* the shared game-page header: duck logo and the way back on the left, music, sound and theme on the right */
header{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;font-size:12px;border-bottom:1px solid var(--g2);position:sticky;top:0;z-index:40;background:var(--nav-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header .hleft{display:flex;align-items:center;gap:18px}
header .back{padding:8px 0;color:var(--g5);text-decoration:none}
header .back:hover,header .back:focus-visible{color:var(--fg)}
header .right{display:flex;gap:10px;align-items:center}
@media (min-width:641px){header:has(.roomnav){padding-top:16px;padding-bottom:16px}}   /* the 44px room buttons take the padding, so the header keeps its height */
.storyfoot{max-width:680px;margin:0 auto;padding:0 24px 56px}
.storyfoot .sitelinks{padding-top:20px;border-top:1px solid var(--g3)}

/* the reading column: 680px of text on the page background, nothing boxed */
.story{--gold:#c9a63f;max-width:680px;margin:0 auto;padding:clamp(40px,6vw,72px) 24px 96px}
.kicker{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:600 12.5px/1.2 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--g5)}
.kicker::before{content:'';width:18px;height:2px;background:var(--gold)}
.story h1{margin:0;font:700 clamp(34px,5.2vw,54px)/1.08 var(--font-sans);letter-spacing:-.02em;color:var(--fg)}
.subtitle{margin:14px 0 0;font:400 clamp(18px,1.7vw,21px)/1.45 var(--font-sans);color:var(--g6)}

.byline{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;margin-top:24px}   /* duck | author block, the duck centred on the whole block */
.author-duck{position:relative;flex:none;height:96px;aspect-ratio:346/330}
.author-duck img,.author-duck svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.author-duck svg{overflow:visible}
.who{min-width:0;font:400 14.5px/1.5 var(--font-sans);color:var(--g5)}
.who .name{display:block;font-weight:700;font-size:16px;color:var(--fg)}
.who .role{display:block;font-style:italic;color:var(--g6)}
.who .meta{display:block}
.who .short{display:none}
.who .also{display:inline-block;margin-top:2px;color:var(--g6);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.who .also:hover,.who .also:focus-visible{color:var(--fg)}

/* the essay itself: a restrained serif, left-aligned, ~1.65 leading */
.essay{margin-top:28px;font:400 20px/1.7 Georgia,'Times New Roman',serif;color:var(--g7)}
.essay p{margin:0 0 1.05em}
.essay a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.essay a:hover{color:var(--fg)}
.essay strong{font-weight:700;color:var(--fg)}
/* the one pull quote: a thin neutral rule, a little larger, still regular serif */
.essay blockquote{margin:1.6em 0;padding:2px 0 2px 22px;border-left:2px solid var(--g4);font-size:1.12em;line-height:1.55;color:var(--fg)}
.essay blockquote p{margin:0}
/* thematic breaks: short and quiet, no section titles */
.essay hr{width:80px;height:0;margin:52px 0;border:0;border-top:1px solid var(--g4)}
/* the three questions read as one small sequence */
.essay .questions{line-height:1.6}
/* a setup line sits close to its reply */
.essay .setup{margin-bottom:.35em}
/* the arcade photograph steps out of the column to ~860px, centred on the same axis */
.essay figure{position:relative;left:50%;transform:translateX(-50%);width:min(860px,calc(100vw - 48px));margin:44px 0 40px}
.essay figure img{display:block;width:100%;height:auto}
.essay figcaption{max-width:680px;margin:12px auto 0;font:italic 14.5px/1.45 var(--font-sans);color:var(--g5);text-align:center}


.essay .sig{margin:2.2em 0 0;font:600 17px/1.4 var(--font-sans);color:var(--fg)}
.endnotes{margin-top:44px;padding-top:28px;border-top:1px solid var(--g3);font:400 16px/1.65 var(--font-sans);color:var(--g7)}
.endnotes h2{margin:0 0 8px;font:600 12.5px/1.2 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--g5)}
.endnotes p{margin:0 0 14px}
.endnotes a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.endnotes a:hover{color:var(--fg)}
.endnotes .music{font-size:15px;color:var(--g6);margin:0}
.endnotes .music-h{margin-top:22px}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:40px}
.play{display:inline-flex;align-items:center;min-height:50px;padding:0 24px;border-radius:12px;background:var(--fg);color:var(--bg);font:600 16px var(--font-sans);text-decoration:none;transition:transform .16s,opacity .16s}
.play:hover{transform:translateY(-2px);opacity:.9}
.more{font:500 15px var(--font-sans);color:var(--g6);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.more:hover{color:var(--fg)}
.play:focus-visible,.more:focus-visible,.who .also:focus-visible,header .back:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

@media (max-width:640px){
  header{padding:16px 20px}
  .story{padding:36px 20px 72px}
  .byline{gap:14px}
  .author-duck{height:auto;width:80px}
  .who{font-size:14px}
  .who .long{display:none}.who .short{display:inline}
  .essay{font-size:18px}
  .essay figure{width:100%;left:0;transform:none;margin:34px 0 30px}
  .essay figcaption{font-size:14px}
  .essay blockquote{padding-left:14px;font-size:1.08em}
}
</style>
</head>
